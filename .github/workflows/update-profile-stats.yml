name: Update Profile Stats

on:
  schedule:
    - cron: '0 6 * * *'  # daily at 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ---- Stats / Top-languages / Streak ----
      - name: Generate stats SVG
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&theme=dark&hide_border=true&include_all_commits=true&count_private=true
          path: profile/stats.svg

      - name: Generate top-languages SVG
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&langs_count=10&theme=dark&hide_border=true
          path: profile/top-langs.svg

      # ---- Trophy / Achievements ----
      - name: Generate trophy SVG
        uses: ryo-ma/github-profile-trophy@master
        with:
          username: ${{ github.repository_owner }}
          output_path: profile/trophy.svg
          theme: darkhub
          column: 4
          row: 2
          margin-w: 15
          margin-h: 15
          no-bg: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit SVG updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/
          git diff --cached --quiet || git commit -m "📈 Update profile stats & trophies [skip ci]"
          git push